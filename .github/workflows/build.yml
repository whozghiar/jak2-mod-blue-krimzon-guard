name: 🛠️ Build Check

# On-demand compile check for gk, goalc and extractor - the same binaries
# release.yml packages - on Windows and Linux, Release config, static
# libraries. Manual only (workflow_dispatch): open this workflow from the
# Actions tab, pick "Use workflow from" with any branch that carries this
# file (every mod branch does, see scripts/modding/sync_common.py), and run
# it. This never packages or publishes anything, it only confirms the
# project builds cleanly and uploads the raw binaries as build artifacts.
#
# Restricted to the repository owner (see the `authorize` job) - a full
# Windows+Linux build burns real CI minutes, so only the owner may trigger
# it, regardless of who else has write access.

on:
  workflow_dispatch:

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  authorize:
    name: "🔒 Verify Authorized Actor"
    runs-on: ubuntu-latest
    steps:
      - name: Restrict to repository owner
        if: github.actor != github.repository_owner
        run: |
          echo "::error::This workflow may only be run by the repository owner (${{ github.repository_owner }}). Triggered by: ${{ github.actor }}."
          exit 1

  build-windows:
    name: "🖥️ Windows (Clang-CL Static)"
    needs: authorize
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 0

      - name: Install NASM
        run: choco install nasm

      - name: Setup sccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          variant: sccache
          key: windows-build-check-static-${{ github.sha }}
          restore-keys: windows-build-check-static-

      - name: Setup MSVC Command Prompt
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Remove Strawberry Perl from PATH
        run: |
          $env:PATH = $env:PATH -replace "C:\\Strawberry\\c\\bin;", ""
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -B build --preset=Release-windows-clang-static ^
            -DCMAKE_C_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build Binaries (gk, goalc, extractor)
        shell: cmd
        run: cmake --build build --config Release --target gk --target goalc --target extractor --parallel %NUMBER_OF_PROCESSORS%

      - name: Upload Windows Binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-check-windows
          path: |
            build/bin/gk.exe
            build/bin/goalc.exe
            build/bin/extractor.exe
          if-no-files-found: error
          retention-days: 3

  build-linux:
    name: "🐧 Linux (Clang Static)"
    needs: authorize
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang gcc g++ nasm \
            libxrandr-dev libxinerama-dev libxcursor-dev libpulse-dev \
            libxi-dev libgl1-mesa-dev libssl-dev ninja-build zip

      - name: Setup sccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          variant: sccache
          key: linux-build-check-static-${{ github.sha }}
          restore-keys: linux-build-check-static-

      - name: Configure CMake
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build --preset=Release-linux-clang-static \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build Binaries (gk, goalc, extractor)
        run: cmake --build build --config Release --target gk --target goalc --target extractor --parallel $(nproc)

      - name: Strip Binaries
        run: |
          strip build/game/gk
          strip build/goalc/goalc
          strip build/decompiler/extractor

      - name: Upload Linux Binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-check-linux
          path: |
            build/game/gk
            build/goalc/goalc
            build/decompiler/extractor
          if-no-files-found: error
          retention-days: 3
